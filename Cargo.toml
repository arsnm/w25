[package]
name = "w25"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An embedded-hal (async/blocking) driver for the W25 series"
repository = "https://github.com/tweedegolf/w25"
readme = "README.md"
keywords = ["no_std", "embedded", "flash", "w25"]
categories = ["no-std::no-alloc", "embedded"]

[dependencies]
embedded-hal = { version = "1.0"}
derive_more = { version = "2.1", default-features = false, features = ["try_from"] }

embedded-storage = {version = "0.3", optional = true }

embedded-hal-async = { version = "1.0", optional = true }
embedded-storage-async = {version = "0.4", optional = true }
embassy-futures = {version = "0.1", optional = true }

defmt = { version = "1.0", optional = true }

[features]
default = ["async"]
async = ["dep:embedded-hal-async", "dep:embedded-storage-async", "dep:embassy-futures"]
blocking = ["dep:embedded-storage"]
defmt = ["dep:defmt"]
